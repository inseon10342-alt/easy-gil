<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191D21">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Route">
<title>Route</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#191D21; --bg2:#292F32; --lime:#C4F35A; --tx:#F5F7F7; --tx2:#A6B0B4;
  --line:#353C40; --err:#FF7A6B; --kb:0px;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard",sans-serif;
  background:var(--bg);color:var(--tx);font-size:16px;line-height:1.4;overflow:hidden;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.2px}
button,input{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 화면 ---------- */
.view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
  padding-top:var(--st);transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s;will-change:transform}
.view.off-right{transform:translateX(100%);pointer-events:none}
.view.off-left{transform:translateX(-24%);opacity:.0;pointer-events:none}
.scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* ---------- 검색 화면 ---------- */
.brand{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.brand b{font-size:28px;font-weight:800;letter-spacing:-.8px}
.brand b i{font-style:normal;color:var(--lime)}
.fields{margin:10px 16px 0;background:var(--bg2);border-radius:16px;overflow:hidden}
.field{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:56px}
.field+.field{border-top:1px solid var(--line)}
.field .dot{flex:0 0 10px;height:10px;border-radius:50%;border:2px solid var(--tx2)}
.field .dot.to{background:var(--lime);border-color:var(--lime)}
.field input{flex:1;min-width:0;height:56px;font-size:17px;font-weight:600}
.field input::placeholder{color:var(--tx2);font-weight:500}
.field input::-webkit-search-cancel-button{display:none}
.field .clr{flex:0 0 auto;width:36px;height:36px;border-radius:50%;color:var(--tx2);font-size:18px}
.field .gps{flex:0 0 auto;height:32px;padding:0 10px;border-radius:9px;background:#353C40;color:var(--tx2);font-size:13px;font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 6px;color:var(--tx2);font-size:13px;font-weight:700;letter-spacing:.2px}
.sec button{color:var(--tx2);font-size:13px;padding:6px 0 6px 10px}
.list{list-style:none;padding:0 4px calc(16px + var(--sb) + var(--kb))}
.list li{display:flex;align-items:center;gap:6px;padding:0 12px}
.list li+li .it{border-top:1px solid var(--line)}
.it{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 4px;min-height:60px}
.it .ic{flex:0 0 32px;height:32px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:15px}
.it .tx{flex:1;min-width:0}
.it b{display:block;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it b mark{background:none;color:var(--lime)}
.it span{display:block;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.it em{flex:0 0 auto;font-style:normal;font-size:12px;color:var(--tx2)}
.del{flex:0 0 32px;height:32px;color:var(--tx2);font-size:16px}
.empty{color:var(--tx2);font-size:14px;padding:18px 20px}

/* ---------- 결과 화면 ---------- */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.back{width:44px;height:44px;border-radius:12px;font-size:24px;color:var(--tx)}
.top .t{flex:1;min-width:0}
.top .t small{display:block;font-size:12px;color:var(--tx2)}
.top .t b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{padding:8px 20px 14px;border-bottom:1px solid var(--line)}
.sum .time{font-size:44px;font-weight:800;letter-spacing:-1.6px;line-height:1.05;color:var(--lime)}
.sum .time small{font-size:20px;font-weight:700;color:var(--tx);margin-left:3px;letter-spacing:-.4px}
.sum .time .arr{font-size:15px;color:var(--tx2);font-weight:600;margin-left:8px;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:13px;color:var(--tx);background:var(--bg2);border-radius:8px;padding:5px 9px;font-weight:600}
.chips span i{font-style:normal;color:var(--tx2);font-weight:500;margin-right:4px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:12px;gap:2px}
.bar i{display:block;height:100%;min-width:4px}
.note{margin-top:10px;font-size:13px;color:var(--lime)}

/* 타임라인 */
.tl{list-style:none;padding:14px 16px calc(96px + var(--sb))}
.node{position:relative;display:grid;grid-template-columns:52px 1fr;column-gap:10px;min-height:44px}
.node .rail{position:relative;display:flex;justify-content:center}
.node .rail::before{content:"";position:absolute;top:0;bottom:0;width:6px;border-radius:3px;background:var(--c,transparent)}
.node.walk .rail::before{width:0;border-left:3px dotted #5B6469;background:none}
.node .pin{position:relative;z-index:1;margin-top:2px;min-width:40px;max-width:52px;overflow:hidden;height:24px;padding:0 6px;border-radius:12px;background:var(--c,#555);color:#fff;
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.node .pin.sm{font-size:10px;padding:0 4px;letter-spacing:-.3px}
.node .pin.xs{font-size:9px;padding:0 3px;letter-spacing:-.4px}
.node .pin.o{width:16px;min-width:16px;height:16px;padding:0;margin-top:6px;background:var(--bg);border:4px solid var(--c,#888)}
.node .pin.end{background:var(--lime);color:#111}
.node .bd{padding:0 0 18px;min-width:0}
.node h3{font-size:18px;font-weight:750;letter-spacing:-.4px}
.node h3 small{font-size:14px;font-weight:600;color:var(--tx2);margin-left:4px}
.node .meta{font-size:13px;color:var(--tx2);margin-top:3px}
.node .way{display:inline-block;margin-top:6px;font-size:14px;font-weight:700}
.node .way b{color:var(--lime)}
.node.walk .bd{padding:6px 0 14px}
.node.walk .meta{margin:0;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:8px;margin-top:8px;border-radius:10px;background:var(--bg2);padding:6px 10px 6px 6px}
.tag .k{font-size:12px;color:var(--tx2);font-weight:700}
.tag .v{background:var(--lime);color:#111;border-radius:7px;padding:2px 8px;font-size:17px;font-weight:850;letter-spacing:-.2px}
.tag.exit .v{font-size:22px;padding:2px 10px}
.tag.unk .v{background:#3A2B2A;color:var(--err);font-size:13px}
.stop{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.stop dt{color:var(--tx2)}
.stop dd{font-weight:700;text-align:right;min-width:0}
.stop dd.ars{color:var(--lime);font-size:17px}
.lnk{display:inline-flex;align-items:center;gap:6px;margin-top:10px;height:36px;padding:0 12px;border-radius:10px;
  background:rgba(196,243,90,.12);color:var(--lime);font-size:14px;font-weight:700}
.lnk:active{background:rgba(196,243,90,.22)}
.lnk:disabled{opacity:.4}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + var(--sb));
  background:linear-gradient(to top,var(--bg) 70%,rgba(25,29,33,0));z-index:20}
.cta{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:15px;background:var(--lime);color:#111;font-size:17px;font-weight:800}
.cta:active{filter:brightness(.92)}

.seg{display:flex;gap:4px;margin:10px 16px 0;padding:3px;background:var(--bg2);border-radius:12px}
.seg button{flex:1;min-width:0;height:34px;border-radius:9px;font-size:14px;font-weight:700;color:var(--tx2);white-space:nowrap}
.seg button.on{background:var(--lime);color:#111}
#vResult .seg{margin:4px 16px 8px}
/* 상태 */
.state{padding:48px 28px;text-align:center}
.state b{display:block;font-size:19px;margin-bottom:8px}
.state p{color:var(--tx2);font-size:14px;margin-bottom:18px;white-space:pre-line}
.state .cta{max-width:220px;margin:0 auto}
.sk{padding:16px 20px}
.sk i{display:block;height:14px;border-radius:7px;background:var(--bg2);margin:12px 0;animation:pl 1.2s ease-in-out infinite}
.sk i:nth-child(1){height:40px;width:40%}.sk i:nth-child(2){width:70%}.sk i:nth-child(3){width:90%}.sk i:nth-child(4){width:60%}
@keyframes pl{50%{opacity:.45}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;transition:opacity .2s}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--sb));z-index:61;background:var(--bg2);border-radius:18px;padding:18px 16px 12px;
  transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet b{display:block;font-size:17px;margin-bottom:4px}
.sheet p{font-size:13px;color:var(--tx2);margin-bottom:14px}
.sheet button{display:block;width:100%;height:50px;border-radius:12px;font-weight:700;font-size:16px;margin-top:8px;background:#353C40}
.sheet button.pri{background:var(--lime);color:#111}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + var(--sb));z-index:70;background:#F5F7F7;color:#111;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;
  white-space:pre-line;transform:translateY(20px);opacity:0;transition:.2s;pointer-events:none}
.toast.on{transform:none;opacity:1}
.offline{position:fixed;top:var(--st);left:0;right:0;z-index:80;background:var(--err);color:#111;text-align:center;font-size:13px;font-weight:700;padding:5px}
@media (prefers-reduced-motion:reduce){.view,.sheet,.toast{transition:none}}
</style>
</head>
<body>
<div class="offline hidden" id="offline">오프라인 · 연결되면 다시 검색하세요</div>

<!-- 검색 -->
<section class="view" id="vSearch">
  <div class="brand"><b>Route<i>.</i></b></div>
  <div class="fields">
    <div class="field"><span class="dot"></span>
      <label class="sr" for="inFrom">출발</label>
      <input id="inFrom" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="현재 위치">
      <button class="gps" id="btnGps" type="button">현재 위치</button>
    </div>
    <div class="field"><span class="dot to"></span>
      <label class="sr" for="inTo">도착</label>
      <input id="inTo" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="어디로 갈까요?">
      <button class="clr hidden" id="clrTo" type="button" aria-label="지우기">✕</button>
    </div>
  </div>
  <div class="seg" role="tablist" aria-label="경로 우선순위"><button type="button" data-pr="bus" role="tab">버스 우선</button><button type="button" data-pr="subway" role="tab">지하철 우선</button><button type="button" data-pr="fast" role="tab">최단시간</button></div>
  <div class="scroll" id="sBody">
    <div id="acWrap" class="hidden"><div class="sec"><span id="acTitle">검색 결과</span></div><ul class="list" id="acList"></ul></div>
    <div id="rcWrap" class="hidden"><div class="sec"><span>최근 검색</span><button id="rcClear" type="button">전체 삭제</button></div><ul class="list" id="rcList"></ul></div>
    <div class="empty hidden" id="sEmpty"></div>
  </div>
</section>

<!-- 결과 -->
<section class="view off-right" id="vResult">
  <div class="top"><button class="back" id="btnBack" type="button" aria-label="뒤로">‹</button>
    <div class="t"><small id="rFrom"></small><b id="rTo"></b></div></div>
  <div class="seg" role="tablist" aria-label="경로 우선순위"><button type="button" data-pr="bus" role="tab">버스 우선</button><button type="button" data-pr="subway" role="tab">지하철 우선</button><button type="button" data-pr="fast" role="tab">최단시간</button></div>
  <div class="scroll" id="rBody"></div>
  <div class="dock hidden" id="dock"><button class="cta" id="btnAll" type="button">네이버지도에서 전체 경로 보기</button></div>
</section>

<div class="sheet-bg hidden" id="sheetBg"></div>
<div class="sheet hidden" id="sheet"></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
'use strict';
const CFG=Object.assign({NAVER_KEY_ID:'',ODSAY_API_KEY:'',TMAP_APP_KEY:'',KAKAO_JS_KEY:''},window.APP_CONFIG||{});
const NS='go_', TIMEOUT=15000, WALK_LIMIT=20, RECENT_MAX=6;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(NS+k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v));}catch(e){}}};
const hasVal=v=>v!=null&&v!==''&&v!=='null'&&v!=='0'&&v!==0;
const fmtM=m=>{m=Math.round(m);return m>=1000?(m/1000).toFixed(1)+'km':m+'m';};
function dist(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const s=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
let tt; function toast(m,ms=3200){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms);}

/* ---------- 오류 ---------- */
class UErr extends Error{constructor(m,n){super(m);this.next=n||'';}}
async function net(url,opt={},what='서버'){
  if(!navigator.onLine) throw new UErr('오프라인 상태입니다','인터넷에 연결한 뒤 다시 검색하세요.');
  const c=new AbortController(),t=setTimeout(()=>c.abort(),TIMEOUT); let r;
  try{ r=await fetch(url,{...opt,signal:c.signal}); }
  catch(e){ throw e.name==='AbortError'?new UErr(what+' 응답 지연','잠시 후 다시 검색하세요.'):new UErr(what+' 연결 실패','네트워크를 확인하고 다시 검색하세요.'); }
  finally{clearTimeout(t);}
  if(r.status===401||r.status===403) throw new UErr(what+' 인증 오류','API 키 또는 허용 도메인을 확인해야 합니다.');
  if(r.status===429) throw new UErr(what+' 사용 한도 초과','내일 다시 시도하세요.');
  if(r.status>=500) throw new UErr(what+' 일시 오류','잠시 후 다시 검색하세요.');
  return r;
}

/* ---------- 외부 스크립트 로더 ---------- */
function loadScript(src,ready,label){
  return new Promise((res,rej)=>{
    if(ready()) return res();
    const s=document.createElement('script'),t=setTimeout(()=>{s.remove();rej(new UErr(label+' 응답 지연','잠시 후 다시 시도하세요.'));},TIMEOUT);
    s.src=src; s.onerror=()=>{clearTimeout(t);s.remove();rej(new UErr(label+' 불러오기 실패','네트워크 또는 키 설정을 확인하세요.'));};
    s.onload=()=>{clearTimeout(t);res();}; document.head.appendChild(s);
  });
}
let kakaoP=null, naverP=null, kakaoBroken=false;
function loadKakao(){
  if(window.kakao?.maps?.services) return Promise.resolve();
  return kakaoP||(kakaoP=loadScript('https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(CFG.KAKAO_JS_KEY)+'&libraries=services&autoload=false',()=>!!window.kakao?.maps?.load,'장소 검색')
    .then(()=>new Promise((res,rej)=>{const t=setTimeout(()=>rej(new UErr('장소 검색 응답 지연','')),TIMEOUT);kakao.maps.load(()=>{clearTimeout(t);window.kakao.maps.services?res():rej(new UErr('장소 검색 모듈 없음',''));});}))
    .catch(e=>{kakaoP=null;throw e;}));
}
function loadNaver(){
  if(window.naver?.maps?.Service) return Promise.resolve();
  return naverP||(naverP=loadScript('https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId='+encodeURIComponent(CFG.NAVER_KEY_ID)+'&submodules=geocoder',()=>!!window.naver?.maps,'주소 검색')
    .then(async()=>{for(let i=0;i<40&&!naver.maps.Service?.geocode;i++)await new Promise(r=>setTimeout(r,200)); if(!naver.maps.Service?.geocode) throw new UErr('주소 검색 모듈 없음','');})
    .catch(e=>{naverP=null;throw e;}));
}

/* ---------- 장소 검색(자동완성) ---------- */
async function kakaoSearch(q,near){
  await loadKakao();
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>rej(new UErr('장소 검색 응답 지연','')),TIMEOUT), opt={size:12};
    if(near){opt.location=new kakao.maps.LatLng(near.lat,near.lng);}
    new kakao.maps.services.Places().keywordSearch(q,(d,st)=>{clearTimeout(t);const S=kakao.maps.services.Status;
      if(st===S.ZERO_RESULT) return res([]); if(st!==S.OK) return rej(new UErr('장소 검색 실패','잠시 후 다시 시도하세요.'));
      res(d.map(x=>({name:x.place_name,addr:x.road_address_name||x.address_name||'',cat:(x.category_name||'').split('>').pop().trim(),pos:{lat:+x.y,lng:+x.x}})));},opt);
  });
}
async function naverGeocode(q){
  await loadNaver();
  return new Promise((res,rej)=>{const t=setTimeout(()=>rej(new UErr('주소 검색 응답 지연','')),TIMEOUT);
    naver.maps.Service.geocode({query:q},(st,r)=>{clearTimeout(t);if(st!==naver.maps.Service.Status.OK) return rej(new UErr('주소 검색 실패',''));
      res((r?.v2?.addresses||[]).map(a=>({name:a.roadAddress||a.jibunAddress,addr:a.jibunAddress||'',cat:'주소',pos:{lat:+a.y,lng:+a.x}})));});});
}
async function searchPlaces(q,near){
  if(!navigator.onLine) throw new UErr('오프라인 상태입니다','인터넷에 연결한 뒤 다시 검색하세요.');
  let list;
  if(CFG.KAKAO_JS_KEY&&!kakaoBroken){ try{ list=await kakaoSearch(q,near); }catch(e){ if(!navigator.onLine) throw e; kakaoBroken=true; } }
  if(!list) list=await naverGeocode(q);
  const seen=new Set();
  return list.filter(o=>{const k=o.name+'|'+o.addr;if(!o.pos.lat||seen.has(k))return false;seen.add(k);return true;});
}

/* ---------- 대중교통 경로 (ODsay) ---------- */
const OD_ERR={'-98':['출발지와 도착지가 700m 이내','걸어서 이동하세요.'],'-99':['대중교통 경로 없음','출발지 또는 목적지를 바꿔 보세요.'],
  '3':['출발지 주변 정류장 없음','출발지를 바꿔 보세요.'],'4':['도착지 주변 정류장 없음','목적지를 다시 확인하세요.'],'5':['주변 정류장 없음','장소를 다시 확인하세요.'],
  '6':['서비스 지역 아님',''],'500':['경로 서버 일시 오류','잠시 후 다시 검색하세요.']};
async function odsay(from,to){
  const p=new URLSearchParams({SX:from.lng,SY:from.lat,EX:to.lng,EY:to.lat,OPT:'0',SearchPathType:'0',apiKey:CFG.ODSAY_API_KEY});
  const r=await net('https://api.odsay.com/v1/api/searchPubTransPathT?'+p,{},'경로 검색');
  let j; try{ j=await r.json(); }catch(e){ throw new UErr('경로 응답 오류','잠시 후 다시 검색하세요.'); }
  const er=j.error?(Array.isArray(j.error)?j.error[0]:j.error):null;
  if(er){const c=String(er.code),raw=er.msg||er.message||'';const m=OD_ERR[c]||(/key|auth|uri|domain/i.test(raw)?['경로 서비스 인증 오류','API 키·등록 URI를 확인해야 합니다.']:['경로 검색 오류','잠시 후 다시 검색하세요.']);const e=new UErr(m[0],m[1]);e.code=c;throw e;}
  return j.result?.path||[];
}
const score=p=>{const i=p.info,tr=Math.max(0,(i.subwayTransitCount||0)+(i.busTransitCount||0)-1);return i.totalTime+tr*7+(i.totalWalk||0)/1000*6;};
const lastWalk=p=>{const l=p.subPath[p.subPath.length-1];return l&&l.trafficType===3?(l.sectionTime||0):0;};
const PR_LABEL={bus:'버스',subway:'지하철',fast:'최단시간'};
function pickRoute(paths,pr){
  paths=(paths||[]).filter(p=>p&&p.info&&Array.isArray(p.subPath)&&p.subPath.some(s=>s.trafficType!==3));
  if(!paths.length) return null;
  const by=t=>paths.filter(p=>p.pathType===t).sort((a,b)=>score(a)-score(b));
  const fastest=[...paths].sort((a,b)=>a.info.totalTime-b.info.totalTime||score(a)-score(b))[0];
  const tooLong=p=>p.info.totalTime>fastest.info.totalTime*1.5&&p.info.totalTime-fastest.info.totalTime>=15;
  if(pr==='fast') return {p:fastest,note:''};
  if(pr==='bus'){
    // 버스만 이용하는 경로 우선, 없으면 버스를 포함한 경로
    const bus=by(2)[0], mix=by(3)[0], cand=bus||mix;
    if(!cand) return {p:fastest,note:'버스 경로가 없어 최단시간 경로로 안내합니다'};
    if(tooLong(cand)) return {p:fastest,note:`버스로는 ${cand.info.totalTime}분 걸려 더 빠른 경로를 추천합니다`};
    return {p:cand,note:bus?'':'버스만 이용하는 경로가 없어 지하철 연계 경로로 안내합니다'};
  }
  // 지하철 우선
  const sub=by(1)[0], mix=by(3)[0];
  if(sub){
    if(mix){
      const w=lastWalk(sub);
      if(w>WALK_LIMIT&&lastWalk(mix)<w) return {p:mix,note:`역에서 목적지까지 도보 ${w}분이라 버스 연계 경로로 안내합니다`};
    }
    if(tooLong(sub)) return {p:fastest,note:`지하철로는 ${sub.info.totalTime}분 걸려 더 빠른 경로를 추천합니다`};
    return {p:sub,note:''};
  }
  if(mix) return {p:mix,note:'지하철만 이용하는 경로가 없어 버스 연계 경로로 안내합니다'};
  return {p:fastest,note:'지하철 경로가 없어 최단시간 경로로 안내합니다'};
}
/* ---------- 노선 색 ---------- */
const LC={1:'#0052A4',2:'#00A84D',3:'#EF7C1C',4:'#00A5DE',5:'#996CAC',6:'#CD7C2F',7:'#747F00',8:'#E6186C',9:'#BDB092',
  100:'#F5A200',101:'#0090D2',102:'#0065B3',104:'#77C4A3',107:'#0065B3',108:'#6789CA',109:'#D4003B',110:'#FDA600',112:'#81A914',113:'#B7C452',114:'#8FC31F',115:'#B0CE18',116:'#F5A200',117:'#A17800'};
const BUSC={1:'#3D8B37',2:'#0A64A0',3:'#0A64A0',4:'#53B332',5:'#F2B70A',6:'#E60012',10:'#0A64A0',11:'#0A64A0',12:'#53B332',13:'#F2B70A',14:'#E60012',15:'#E60012',26:'#0A64A0'};
const pinCls=t=>{const L=[...String(t)].reduce((a,c)=>a+(/[\x00-\x7F]/.test(c)?1:1.7),0);return L>6.5?' xs':L>4.2?' sm':'';};
const segColor=s=>s.trafficType===1?(LC[s.lane?.[0]?.subwayCode]||'#6B7378'):(BUSC[s.lane?.[0]?.type]||'#3D8B37');
const short=n=>String(n||'').replace(/^(수도권|부산|대구|광주|대전)\s*/,'');
const lineName=s=>{const l=s.lane?.[0]||{};return s.trafficType===1?(short(l.name)||'지하철'):(l.busNo?l.busNo:'버스');};
// 왼쪽 노선 표시용 약칭: 1~9호선 → 숫자, 인천1호선 → 인1, 그 외 노선 → 앞 2글자(괄호·'선' 제거)
const pinTxt=s=>{
  const n=lineName(s); if(s.trafficType!==1) return n;
  const base=n.replace(/\(.*?\)/g,'').trim();
  let m=base.match(/^(\d+)호선/); if(m) return m[1];
  m=base.match(/^(인천|부산|대구|광주|대전)\s*(\d+)호선/); if(m) return m[1][0]+m[2];
  if(/^GTX/i.test(base)) return 'GTX';
  return base.replace(/선$/,'').slice(0,2);
};

/* ---------- 상태 ---------- */
const S={from:null,fromName:'현재 위치',gps:null,to:null,mode:'to',route:null,paths:null,pr:['bus','subway','fast'].includes(store.get('pr','bus'))?store.get('pr','bus'):'bus'};
function syncSeg(){ document.querySelectorAll('[data-pr]').forEach(b=>{const on=b.dataset.pr===S.pr;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);}); }
document.addEventListener('click',e=>{const b=e.target.closest('[data-pr]'); if(!b||b.dataset.pr===S.pr) return;
  S.pr=b.dataset.pr; store.set('pr',S.pr); syncSeg();
  if(S.paths&&!$('#vResult').classList.contains('off-right')){ const sel=pickRoute(S.paths,S.pr); if(sel){ S.route=sel.p; renderRoute(sel); } } });

/* ---------- GPS ---------- */
function getGps(){return new Promise((res,rej)=>{
  if(!navigator.geolocation) return rej(new UErr('위치 기능 미지원','출발지를 직접 입력하세요.'));
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
    e=>rej(e.code===1?new UErr('위치 권한 꺼짐','설정 › Safari › 위치에서 허용하거나 출발지를 입력하세요.'):new UErr('현재 위치 확인 실패','출발지를 직접 입력하세요.')),
    {enableHighAccuracy:true,timeout:12000,maximumAge:15000});});}
async function useGps(silent){
  $('#inFrom').value=''; $('#inFrom').placeholder='현재 위치 확인 중…';
  try{ S.gps=await getGps(); S.from=S.gps; S.fromName='현재 위치'; $('#inFrom').placeholder='현재 위치'; }
  catch(e){ S.from=null; $('#inFrom').placeholder='출발지 입력'; if(!silent) toast(e.message+'\n'+e.next); }
}

/* ---------- 최근 검색 (장소명+주소 중복 제거) ---------- */
const rkey=o=>(o.name+'|'+(o.addr||'')).replace(/\s+/g,' ').trim();
const getRecent=()=>{const a=store.get('recent',[]);return Array.isArray(a)?a.filter(o=>o&&o.name&&o.pos):[];};
function addRecent(o){const k=rkey(o),l=getRecent().filter(x=>rkey(x)!==k);l.unshift({name:o.name,addr:o.addr||'',cat:o.cat||'',pos:o.pos});store.set('recent',l.slice(0,RECENT_MAX));}
function renderRecent(){
  const l=getRecent(); $('#rcWrap').classList.toggle('hidden',!l.length||!$('#acWrap').classList.contains('hidden'));
  $('#rcList').innerHTML=l.map((o,i)=>`<li><button class="it" data-r="${i}" type="button"><span class="ic">↺</span><span class="tx"><b>${esc(o.name)}</b><span>${esc(o.addr)}</span></span></button><button class="del" data-rd="${i}" type="button" aria-label="삭제">✕</button></li>`).join('');
}
$('#rcList').addEventListener('click',e=>{const g=e.target.closest('[data-r]'),d=e.target.closest('[data-rd]'),l=getRecent();
  if(g){ S.mode='to'; choose(l[+g.dataset.r]); } if(d){ l.splice(+d.dataset.rd,1); store.set('recent',l); renderRecent(); }});
$('#rcClear').onclick=()=>{store.set('recent',[]);renderRecent();};

/* ---------- 자동완성 ---------- */
let acTimer=null, acSeq=0, acItems=[];
function hl(name,q){const i=name.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(name):esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length));}
function showAc(on){$('#acWrap').classList.toggle('hidden',!on);$('#sEmpty').classList.add('hidden');renderRecent();}
async function runAc(q,mode,immediate){
  clearTimeout(acTimer); q=q.trim();
  if(!q){ showAc(false); return; }
  const go=async()=>{
    const seq=++acSeq; $('#acTitle').textContent=mode==='from'?'출발지 검색':'도착지 검색';
    try{
      const near=S.gps||S.from; const l=await searchPlaces(q,near); if(seq!==acSeq) return;
      acItems=l;
      if(!l.length){ showAc(false); $('#sEmpty').textContent=`‘${q}’ 검색 결과가 없습니다. 장소명이나 주소를 다시 확인하세요.`; $('#sEmpty').classList.remove('hidden'); return; }
      $('#acList').innerHTML=l.map((o,i)=>{const d=near?dist(near,o.pos):null;
        return `<li><button class="it" data-a="${i}" type="button"><span class="ic">${o.cat==='주소'?'⌂':'⌖'}</span><span class="tx"><b>${hl(o.name,q)}</b><span>${esc(o.addr)}</span></span>${d!=null?`<em>${fmtM(d)}</em>`:''}</button></li>`;}).join('');
      showAc(true);
    }catch(e){ if(seq!==acSeq) return; showAc(false); $('#sEmpty').textContent=e.message+(e.next?' · '+e.next:''); $('#sEmpty').classList.remove('hidden'); }
  };
  if(immediate) go(); else acTimer=setTimeout(go,280);
}
$('#acList').addEventListener('click',e=>{const b=e.target.closest('[data-a]'); if(b) choose(acItems[+b.dataset.a]);});
$('#inTo').addEventListener('input',e=>{S.mode='to';$('#clrTo').classList.toggle('hidden',!e.target.value);runAc(e.target.value,'to');});
$('#inTo').addEventListener('focus',()=>{S.mode='to';});
$('#inFrom').addEventListener('input',e=>{S.mode='from';runAc(e.target.value,'from');});
$('#inFrom').addEventListener('focus',()=>{S.mode='from';});
$('#inTo').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runAc(e.target.value,'to',true);}});
$('#inFrom').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runAc(e.target.value,'from',true);}});
$('#clrTo').onclick=()=>{$('#inTo').value='';$('#clrTo').classList.add('hidden');showAc(false);$('#inTo').focus();};
$('#btnGps').onclick=()=>{useGps(false);showAc(false);$('#inTo').focus();};
function choose(o){
  if(!o) return;
  if(S.mode==='from'){ S.from=o.pos; S.fromName=o.name; $('#inFrom').value=o.name; showAc(false); $('#inTo').focus(); return; }
  S.to=o; $('#inTo').value=o.name; $('#clrTo').classList.remove('hidden'); addRecent(o); showAc(false);
  document.activeElement?.blur?.(); findRoute();
}

/* ---------- 화면 전환 ---------- */
function goResult(){ $('#vSearch').classList.add('off-left'); $('#vResult').classList.remove('off-right'); try{history.pushState({v:'r'},'');}catch(e){} }
function goSearch(push){ $('#vResult').classList.add('off-right'); $('#vSearch').classList.remove('off-left'); $('#dock').classList.add('hidden'); renderRecent(); }
$('#btnBack').onclick=()=>{ try{history.back();}catch(e){goSearch();} setTimeout(()=>{ if(!$('#vResult').classList.contains('off-right')) goSearch(); },120); };
window.addEventListener('popstate',()=>goSearch());

/* ---------- 경로 찾기 ---------- */
async function findRoute(){
  S.paths=null; goResult(); $('#rTo').textContent=S.to.name; $('#rFrom').textContent=(S.fromName||'현재 위치')+' → ';
  $('#dock').classList.add('hidden'); $('#rBody').innerHTML='<div class="sk"><i></i><i></i><i></i><i></i></div>';
  if(!S.from){ await useGps(true); if(!S.from) return stateErr(new UErr('출발지를 알 수 없습니다','위치 권한을 허용하거나 출발지를 직접 입력하세요.'),'출발지 입력',()=>{history.back();setTimeout(()=>$('#inFrom').focus(),350);}); }
  try{
    let paths;
    try{ paths=await odsay(S.from,S.to.pos); }
    catch(e){ S.paths=null; if(e.code==='-98') return renderWalkOnly(); throw e; }
    S.paths=paths; const sel=pickRoute(paths,S.pr);
    if(!sel) return stateErr(new UErr('대중교통 경로 없음','출발지 또는 목적지를 바꿔 보세요.'));
    S.route=sel.p; renderRoute(sel);
  }catch(e){ stateErr(e); }
}
function stateErr(e,btn,fn){
  $('#rBody').innerHTML=`<div class="state"><b>${esc(e.message||'오류가 발생했습니다')}</b><p>${esc(e.next||'잠시 후 다시 시도하세요.')}</p><button class="cta" id="btnRetry" type="button">${esc(btn||'다시 검색')}</button></div>`;
  $('#btnRetry').onclick=fn||findRoute;
}
function renderWalkOnly(){
  const d=dist(S.from,S.to.pos);
  $('#rBody').innerHTML=`<div class="sum"><div class="time">도보<small>약 ${fmtM(d)}</small></div><div class="note">목적지가 700m 이내라 걸어가는 편이 빠릅니다</div></div>
    <div style="padding:18px 16px"><button class="lnk" id="lkWalk" type="button">네이버지도 도보 길찾기 ›</button></div>`;
  $('#lkWalk').onclick=()=>openNmap('walk',{pos:S.from,name:S.fromName},{pos:S.to.pos,name:S.to.name});
}

/* ---------- 결과 렌더링: 세로 타임라인 ---------- */
function renderRoute(sel){
  const p=sel.p,i=p.info,sp=p.subPath, T=sp.map((s,k)=>({s,k})).filter(o=>o.s.trafficType!==3);
  const tr=Math.max(0,(i.subwayTransitCount||0)+(i.busTransitCount||0)-1);
  const walkMin=sp.filter(s=>s.trafficType===3).reduce((a,s)=>a+(s.sectionTime||0),0);
  const arr=new Date(Date.now()+i.totalTime*60000), hh=arr.getHours(), mm=String(arr.getMinutes()).padStart(2,'0');
  const total=sp.reduce((a,s)=>a+(s.sectionTime||0),0)||1;
  let h=`<div class="sum"><div class="time">${Math.round(i.totalTime)}<small>분</small><span class="arr">${hh<12?'오전':'오후'} ${((hh+11)%12)+1}:${mm} 도착</span></div>
    <div class="chips"><span><i>도보</i>${walkMin}분</span><span><i>환승</i>${tr}회</span>${i.payment?`<span><i>요금</i>${i.payment.toLocaleString()}원</span>`:''}</div>
    <div class="bar">${sp.map(s=>`<i style="flex:${Math.max(1,s.sectionTime||0)/total*100};background:${s.trafficType===3?'#41494E':segColor(s)}"></i>`).join('')}</div>
    ${sel.note?`<div class="note">${esc(sel.note)}</div>`:''}</div><ol class="tl">`;
  const walkNode=(s,txt,extra='')=>`<li class="node walk"><div class="rail"></div><div class="bd"><div class="meta">${txt}${s?` · ${s.sectionTime||0}분${s.distance>0?' · '+fmtM(s.distance):''}`:''}</div>${extra}</div></li>`;
  // 출발
  h+=`<li class="node"><div class="rail" style="--c:transparent"><span class="pin o" style="--c:var(--tx2)"></span></div><div class="bd"><h3>${esc(S.fromName||'출발')}</h3><div class="meta">출발</div></div></li>`;
  T.forEach((o,idx)=>{
    const s=o.s,k=o.k,prev=idx>0?T[idx-1].s:null,next=T[idx+1]?.s,isLast=idx===T.length-1,wb=sp[k-1]?.trafficType===3?sp[k-1]:null,c=segColor(s);
    // 앞 도보
    if(idx===0) h+=walkNode(wb,'도보');
    else if(prev.trafficType===1&&s.trafficType===1) h+=walkNode(wb,'환승 도보');
    else if(prev.trafficType===1&&s.trafficType===2){
      const ok=hasVal(prev.endExitX)&&hasVal(prev.endExitY)&&hasVal(s.startX);
      h+=walkNode(wb,'출구 → 정류장',`<button class="lnk" type="button" data-nm="${idx}">출구 → 정류장 도보 길찾기 ›</button>`);
    } else h+=walkNode(wb,'도보');
    if(s.trafficType===1){
      const door=next&&next.trafficType===1&&hasVal(s.door)?s.door:null;
      h+=`<li class="node" style="--c:${c}"><div class="rail"><span class="pin${pinCls(pinTxt(s))}" style="--c:${c}" title="${esc(lineName(s))}">${esc(pinTxt(s))}</span></div><div class="bd">
        <h3>${esc(s.startName)}<small>승차</small></h3>
        <div class="meta">${esc(lineName(s))} · ${s.stationCount}개 역 · ${s.sectionTime}분</div>
        <div class="way">${hasVal(s.way)?`<b>${esc(s.way)}</b> 방면`:'<span style="color:var(--err)">방면 확인 불가</span>'}</div>
        ${door?`<div class="tag"><span class="v">${esc(door)}</span><span class="k">빠른 환승 · ${esc(next.startName)}</span></div>`:''}
      </div></li>`;
      const exitTag=(isLast||(next&&next.trafficType===2))
        ? (hasVal(s.endExitNo)?`<div class="tag exit"><span class="v">${esc(s.endExitNo)}번</span><span class="k">${isLast?'추천 출구':'버스 환승 출구'}</span></div>`
                              :`<div class="tag unk"><span class="v">출구 확인 불가</span></div>`):'';
      h+=`<li class="node" style="--c:${isLast||next?.trafficType!==1?'transparent':'transparent'}"><div class="rail"><span class="pin o" style="--c:${c}"></span></div><div class="bd">
        <h3>${esc(s.endName)}<small>${next&&next.trafficType===1?'환승':'하차'}</small></h3>
        ${next&&next.trafficType===1?`<div class="meta">${esc(lineName(next))}으로 갈아타기</div>`:''}${exitTag}</div></li>`;
    } else {
      const st=s.passStopList?.stations||[], nx=st.length>1?st[1].stationName:null, l=s.lane?.[0]||{};
      h+=`<li class="node" style="--c:${c}"><div class="rail"><span class="pin${pinCls(pinTxt(s))}" style="--c:${c}" title="${esc(lineName(s))}">${esc(pinTxt(s))}</span></div><div class="bd">
        <h3>${esc(s.startName)}<small>승차</small></h3>
        <dl class="stop"><dt>정류소 번호</dt><dd class="ars">${hasVal(s.startArsID)?esc(s.startArsID):'<span style="color:var(--err);font-size:13px">확인 불가</span>'}</dd>
          <dt>버스</dt><dd>${esc(l.busNo||'')}번</dd>
          <dt>진행 방향</dt><dd>${nx?'다음 '+esc(nx):'<span style="color:var(--err);font-size:13px">확인 불가</span>'}</dd></dl>
        <div class="meta">${s.stationCount}개 정류장 · ${s.sectionTime}분</div></div></li>
      <li class="node"><div class="rail"><span class="pin o" style="--c:${c}"></span></div><div class="bd"><h3>${esc(s.endName)}<small>하차</small></h3></div></li>`;
    }
  });
  // 마지막 도보 + 도착
  const L=T[T.length-1].s, lw=sp[sp.length-1]?.trafficType===3?sp[sp.length-1]:null;
  h+=walkNode(lw,L.trafficType===1&&hasVal(L.endExitNo)?L.endExitNo+'번 출구 → 목적지':'도보',`<button class="lnk" type="button" id="lkLast">${L.trafficType===1?'출구':'정류장'} → 목적지 도보 길찾기 ›</button>`);
  h+=`<li class="node"><div class="rail"><span class="pin end">도착</span></div><div class="bd"><h3>${esc(S.to.name)}</h3><div class="meta">${esc(S.to.addr||'')}</div></div></li></ol>`;
  $('#rBody').innerHTML=h; $('#rBody').scrollTop=0; $('#dock').classList.remove('hidden');
  // 링크 연결
  document.querySelectorAll('[data-nm]').forEach(b=>{const idx=+b.dataset.nm, s=T[idx].s, prev=T[idx-1].s;
    b.onclick=()=>exitToStop(prev,s);});
  $('#lkLast').onclick=()=>{
    const st=L.trafficType===1
      ? (hasVal(L.endExitX)&&hasVal(L.endExitY)?{pos:{lat:+L.endExitY,lng:+L.endExitX},name:L.endName+'역 '+L.endExitNo+'번 출구'}:null)
      : {pos:{lat:+L.endY,lng:+L.endX},name:L.endName+' 정류장'};
    withStart(st,L.endName+'역',s=>openNmap('walk',s,{pos:S.to.pos,name:S.to.name}));
  };
  $('#btnAll').onclick=()=>openNmap('public',{pos:S.from,name:S.fromName||'출발'},{pos:S.to.pos,name:S.to.name});
}
function exitToStop(prev,s){
  const st=hasVal(prev.endExitX)&&hasVal(prev.endExitY)?{pos:{lat:+prev.endExitY,lng:+prev.endExitX},name:prev.endName+'역 '+(hasVal(prev.endExitNo)?prev.endExitNo+'번 출구':'출구')}:null;
  if(!hasVal(s.startX)||!hasVal(s.startY)) return toast('정류장 좌표 정보가 없어 길찾기를 열 수 없습니다');
  withStart(st,prev.endName+'역',a=>openNmap('walk',a,{pos:{lat:+s.startY,lng:+s.startX},name:s.startName+' 정류장'}));
}
// 출구 좌표가 없으면 역 중심 대신 현재 위치 사용
async function withStart(st,label,fn){
  if(st) return fn(st);
  try{ const g=await getGps(); toast(label+' 출구 좌표가 없어 현재 위치에서 출발합니다'); fn({pos:g,name:'현재 위치'}); }
  catch(e){ toast('출구 좌표 확인 불가\n'+e.message); }
}

/* ---------- 네이버지도 딥링크 ---------- */
const goUrl=u=>{ if(window.__navTo) window.__navTo(u); else location.href=u; };
function openNmap(type,a,b){
  const e=encodeURIComponent, q=`slat=${a.pos.lat}&slng=${a.pos.lng}&sname=${e(a.name)}&dlat=${b.pos.lat}&dlng=${b.pos.lng}&dname=${e(b.name)}&appname=${e(location.origin+location.pathname)}`;
  const ua=navigator.userAgent;
  if(/Android/i.test(ua)){ goUrl(`intent://route/${type}?${q}#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end`); return; }
  let left=false; const h=()=>{left=true;}; document.addEventListener('visibilitychange',h,{once:true}); window.addEventListener('pagehide',h,{once:true});
  goUrl(`nmap://route/${type}?${q}`);
  setTimeout(()=>{ if(!left&&!document.hidden) fallbackSheet(b); },1600);
}
function fallbackSheet(b){
  const sh=$('#sheet'),bg=$('#sheetBg');
  sh.innerHTML=`<b>네이버지도 앱을 열지 못했습니다</b><p>웹 지도에서 목적지를 보거나 앱을 설치하세요. 웹 지도는 길찾기 좌표 연결을 지원하지 않습니다.</p>
    <button class="pri" id="shWeb" type="button">웹 지도에서 보기</button><button id="shStore" type="button">앱 설치 (App Store)</button><button id="shX" type="button">닫기</button>`;
  bg.classList.remove('hidden'); sh.classList.remove('hidden'); requestAnimationFrame(()=>{bg.classList.add('on');sh.classList.add('on');});
  const close=()=>{bg.classList.remove('on');sh.classList.remove('on');setTimeout(()=>{bg.classList.add('hidden');sh.classList.add('hidden');},250);};
  $('#shWeb').onclick=()=>{close();goUrl('https://map.naver.com/p/search/'+encodeURIComponent(b.name));};
  $('#shStore').onclick=()=>{close();goUrl('https://apps.apple.com/kr/app/id311867728');};
  $('#shX').onclick=close; bg.onclick=close;
}

/* ---------- 키보드 · 확대 방지 · 연결 ---------- */
if(window.visualViewport){ const vv=window.visualViewport, upd=()=>{const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);document.documentElement.style.setProperty('--kb',kb+'px');};
  vv.addEventListener('resize',upd); vv.addEventListener('scroll',upd); }
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
let lastTouch=0; document.addEventListener('touchend',e=>{const n=Date.now(); if(n-lastTouch<300&&!e.target.closest('input')) e.preventDefault(); lastTouch=n;},{passive:false});
const netUi=()=>$('#offline').classList.toggle('hidden',navigator.onLine);
addEventListener('online',netUi); addEventListener('offline',netUi); netUi();
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- 시작 ---------- */
if(!CFG.NAVER_KEY_ID||!CFG.ODSAY_API_KEY){ $('#sBody').innerHTML='<div class="state"><b>설정 필요</b><p>config.js에 API 키를 입력하세요.</p></div>'; }
else { syncSeg(); renderRecent(); useGps(true); }
</script>
